[package]
name = "mauvelyd"
version = "0.1.0"
description = "The Mauvely OS device agent"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tiny_http = "0.12"

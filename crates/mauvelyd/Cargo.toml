[package]
name = "mauvelyd"
version = "0.1.0"
description = "The Mauvely OS device agent"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The push channel (`push`). tungstenite with its handshake only, no TLS
# feature: TLS is rustls on ring with webpki-roots, the same crates and
# provider ureq uses, so nothing new is linked for it, and never aws-lc.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1", features = ["serde"] }
libc = "0.2"

[dev-dependencies]
tiny_http = "0.12"

[package]
name = "mauvely-session"
version = "0.1.0"
description = "The Mauvely OS helper in each graphical session"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zbus = "5"

[dev-dependencies]
# Already in the workspace, through mauvelyd: the Chromium extension's id is
# checked against its key (`browserhost`).
base64 = "0.23"
sha2 = "0.11"
tiny_http = "0.12"

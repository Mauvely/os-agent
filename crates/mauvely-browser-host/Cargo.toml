[package]
name = "mauvely-browser-host"
version = "0.1.0"
description = "The Mauvely OS browser extension's native messaging host"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Runs inside the browser's Flatpak sandbox, from the person's ~/.var/app, so
# it is built as a static musl binary that needs nothing from the runtime:
#   cargo build --release --locked -p mauvely-browser-host --target x86_64-unknown-linux-musl
# No network, so no TLS; std and serde_json only.
[dependencies]
serde_json = "1"
